<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transcribe extension</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font: 13px/1.4 -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        width: 320px;
        margin: 0;
        padding: 14px;
      }
      h1 { font-size: 15px; margin: 0 0 10px; }
      label { display: block; font-size: 12px; color: #5f5f68; margin: 10px 0 4px; }
      input, select {
        width: 100%;
        min-height: 40px;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      .row { display: flex; gap: 8px; }
      .row > * { flex: 1; }
      button {
        width: 100%;
        min-height: 44px;
        margin-top: 10px;
        padding: 8px;
        border: 0;
        border-radius: 6px;
        background: #5b50e0;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary { background: transparent; border: 1px solid #ccc; color: inherit; }
      button:disabled { opacity: 0.5; cursor: default; }
      :where(button, input, select, summary, a):focus-visible {
        outline: 3px solid #4338ca;
        outline-offset: 2px;
      }
      #status { margin-top: 10px; font-size: 12px; color: #3f3f46; min-height: 18px; }
      #status a { color: #4f46c7; }
      .muted { color: #62626b; font-size: 12px; }
      hr { border: 0; border-top: 1px solid #eee; margin: 12px 0; }
      details summary { cursor: pointer; color: #5f5f68; font-size: 12px; padding: 8px 0; }
      @media (prefers-color-scheme: dark) {
        label, details summary, .muted { color: #b5b5bf; }
        #status { color: #dedee3; }
        #status a { color: #aaa4ff; }
        input, select, button.secondary { border-color: #62626b; }
        hr { border-color: #45454d; }
        :where(button, input, select, summary, a):focus-visible { outline-color: #b7b1ff; }
      }
    </style>
  </head>
  <body>
    <h1>Transcribe</h1>

    <div id="setup" hidden>
      <p class="muted">Connect your account to get started.</p>
      <label for="apiBase">API base URL</label>
      <input id="apiBase" type="url" inputmode="url" autocomplete="url" placeholder="http://localhost:3000" />
      <label for="token">API token</label>
      <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="sk_…" />
      <button id="saveSetup">Save</button>
      <p class="muted" style="margin-top: 8px">
        Create a token on your account's <strong>API tokens</strong> page (footer → Extension).
      </p>
    </div>

    <div id="main" hidden>
      <div class="row">
        <div>
          <label for="tier">Quality</label>
          <select id="tier">
            <option value="standard">Standard</option>
            <option value="premium">Premium</option>
          </select>
        </div>
        <div>
          <label for="language">Language</label>
          <select id="language">
            <option value="">Auto-detect</option>
          </select>
        </div>
      </div>

      <button id="record">● Transcribe this tab's audio</button>
      <button id="stop" class="secondary" hidden>■ Stop &amp; transcribe</button>
      <button id="urlJob" class="secondary" hidden>Transcribe the playing media (link)</button>

      <div id="status" role="status" aria-live="polite" aria-atomic="true"></div>

      <hr />
      <details>
        <summary>Settings</summary>
        <label for="apiBase2">API base URL</label>
        <input id="apiBase2" type="url" inputmode="url" autocomplete="url" />
        <label for="token2">API token</label>
        <input id="token2" type="password" autocomplete="off" spellcheck="false" placeholder="leave blank to keep" />
        <button id="save2" class="secondary">Update</button>
      </details>
    </div>

    <script src="api.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
