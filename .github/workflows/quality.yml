name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web migrations, lint, types, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: transcribe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d transcribe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      APP_URL: https://example.invalid
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/transcribe
      STORAGE_DRIVER: local
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Apply database migrations from scratch
        run: npm run db:migrate
      - name: Lint web app
        run: npm run lint
      - name: Type-check web app
        run: npm run typecheck
      - name: Build web app
        run: npm run build

  worker:
    name: Worker tests and compile check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/pyproject.toml
      - name: Install worker
        run: python -m pip install -e .
      - name: Compile worker modules
        run: python -m compileall -q worker tests
      - name: Run worker tests
        run: python -m unittest discover -s tests -v
